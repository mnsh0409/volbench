name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # torch-cpu: the CPU build of the pinned torch, so the PatchTST baseline's
      # 2-epoch smoke test runs here. The tsfm-marked and gpu-marked tests stay
      # skipped (tests/conftest.py never honours their opt-ins under CI).
      - run: uv sync --dev --extra torch-cpu
      - run: uv run --extra torch-cpu ruff check .
      - run: uv run --extra torch-cpu mypy
      - run: uv run --extra torch-cpu pytest
