name: ci

on:
  push:
    # feat/** is included on purpose: the Phase-2 streams found that a
    # branch's "CI green" gate was otherwise only ever replicated locally,
    # because this project merges feat/* branches without pull requests.
    #
    # fix/** for the same reason, and it was omitted only because no such
    # branch existed when the list was written. Two have now shipped without
    # CI ever running -- fix/p3-model-defects and fix/manifest-provenance --
    # and in both cases the absence was noticed only by asking the Actions
    # API for the branch's run count and getting 0. A gate nobody can see is
    # not failing is not a gate.
    branches: [main, "feat/**", "fix/**", "m2/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Pin numpy to its x86-v3 (AVX2/FMA) SIMD kernels. numpy carries
      # AVX-512-only float64 log/exp kernels that are not bit-identical to
      # the v3 ones, and GitHub's runner pool mixes CPU generations, so the
      # overnight-plus-range proxy — five logs per day — came back with a
      # different content digest on an AVX-512 runner and every pinned toy
      # config hash moved with it (docs/P2_INTEGRATION.md §3.6). Disabling a
      # feature the runner lacks is a silent no-op, so this is safe on every
      # runner; the Makefile's reproduce target exports the same value.
      NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
      # Pin the BLAS to one thread (D-032). Threaded OpenBLAS reorders a
      # reduction by an ulp and arch's SLSQP amplifies that into a different
      # local optimum of the Student-t GARCH likelihood — 5.5e-1 relative on
      # garch11_t (docs/P3_DETERMINISM.md §2). The thread count moves no
      # content digest, so it is hashed explicitly instead
      # (`environment.blas_threads`); a runner that ran unpinned would compute
      # different numbers under the pinned identities this repo commits.
      # Job-level, so lint, type and test legs all agree, and so a pool the
      # suite starts inherits it. The Makefile exports the same values.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # classical: statsforecast + lightgbm, so models/sf.py and models/lgbm.py
      # are actually tested rather than importorskip'd.
      # torch-cpu: the CPU build of the pinned torch, so the PatchTST baseline's
      # 2-epoch smoke test runs here. The tsfm-marked and gpu-marked tests stay
      # skipped (tests/conftest.py never honours their opt-ins under CI), and
      # the `tsfm` extra (CUDA torch, foundation-model weights) is never
      # installed in CI.
      - run: uv sync --dev --extra classical --extra torch-cpu
      - run: uv run --extra classical --extra torch-cpu ruff check .
      - run: uv run --extra classical --extra torch-cpu mypy
      - run: uv run --extra classical --extra torch-cpu pytest
