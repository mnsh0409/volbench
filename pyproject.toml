[project]
name = "volbench"
version = "0.0.1"
description = "Leakage-safe, reproducible evaluation of probabilistic volatility and tail-risk forecasts ??from GARCH to time-series foundation models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Martin" }]
keywords = [
  "forecasting",
  "volatility",
  "risk",
  "evaluation",
  "benchmarking",
  "probabilistic-forecasting",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.0"]  # QuantileGrid.crps uses np.trapezoid, added in numpy 2.0

[project.urls]
Repository = "https://github.com/mnsh0409/volbench"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
