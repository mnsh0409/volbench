[project]
name = "volbench"
version = "0.2.0"
description = "Leakage-safe, reproducible evaluation of probabilistic volatility and tail-risk forecasts ??from GARCH to time-series foundation models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Martin" }]
keywords = [
  "forecasting",
  "volatility",
  "risk",
  "evaluation",
  "benchmarking",
  "probabilistic-forecasting",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
    "arch>=8.0.0",
    "numpy>=2.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]  # QuantileGrid.crps uses np.trapezoid, added in numpy 2.0

[project.optional-dependencies]
# Phase-2 classical model backends (docs/research_design.md models 6-8).
# Optional on purpose: `volbench.models.sf` and `volbench.models.lgbm` are the
# only modules that import them, neither is pulled in by `volbench.models`'s
# package root, and the evaluator never imports a backend — so the core suite
# still runs with neither installed.
classical = [
    "statsforecast>=2.0.2",
    "lightgbm>=4.6.0",
]

[project.urls]
Repository = "https://github.com/mnsh0409/volbench"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest-cov>=7.1.0",
    "pandas-stubs>=3.0.5.260730",
]

[tool.uv]
# statsforecast (through 2.1.1, the latest) carries a preemptive
# `pandas<3.0.0` cap; volbench's core requires pandas>=3.0.5, so the
# `classical` extra is unresolvable without lifting it. The cap is a
# compatibility guess, not an observed break: `tests/test_models_sf.py::
# TestBackendCompatibility` runs the two adapters' full statsforecast code
# path under the installed pandas and fails loudly if the cap ever becomes
# real. Revisit (and delete this block) when statsforecast releases with
# pandas 3 support.
override-dependencies = ["pandas>=3.0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# No `python_version` pin. Pinning it to the floor (3.11) made mypy parse the
# INSTALLED dependency stubs under 3.11 rules too, and numpy's own .pyi uses
# 3.12+ `type` statements — so the 3.12 and 3.13 CI legs failed inside
# numpy/__init__.pyi before reaching any volbench code. Unset, mypy targets
# whichever interpreter it runs on, and the CI matrix covers 3.11-3.13, which
# is what actually establishes the supported range.
strict = true
# tests/ is not type-checked wholesale, but test_model_interface.py is: its
# static assertions ARE the check that every model still satisfies the model
# Protocol (M1 integration, docs/design.md "Model interface"). Leaving it out
# would make that file assert nothing at type-check time.
files = ["src", "tests/test_model_interface.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
